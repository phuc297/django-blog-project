{% extends 'base/base.html' %}
{% load crispy_forms_tags %}

{% block content %}
  <h2>{{ form.instance.pk|yesno:'Cập nhật bài viết,Tạo bài viết mới' }}</h2>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="border border-gray-300 bg-green-500 text-white p-1 px-2 ">Lưu</button>
  </form>
{% endblock %}
